</g>
<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M9 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Цикл тестирования автоматизации до боевого запуска</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">M9: проверяем логику на учебном объекте, ловим дубли и лишних получателей, только потом переносим в</tspan>
<tspan x="40" dy="28">рабочий процесс</tspan>
</text>
<text data-owner="card-1" x="64" y="261.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">1 Описать гипотезу</tspan>
</text>
<text data-owner="card-1" x="64" y="306.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Что должно сработать, где, когда и для кого</tspan>
</text>
<text data-owner="card-2" x="64" y="473.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">2 Собрать учебный объект</tspan>
</text>
<text data-owner="card-2" x="64" y="518.8" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Отдельная сделка, задача или смарт-элемент для проверки</tspan>
</text>
<text data-owner="card-3" x="64" y="685.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">3 Запустить тест</tspan>
</text>
<text data-owner="card-3" x="64" y="730.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Проверить условие, событие, срок и права</tspan>
</text>
<text data-owner="card-4" x="64" y="897.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">4 Проверить результат</tspan>
</text>
<text data-owner="card-4" x="64" y="942.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Логи, получатели, дубли, повторные запуски</tspan>
</text>
<text data-owner="card-5" x="64" y="1109.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">6 Перенести в бой</tspan>
</text>
<text data-owner="card-5" x="64" y="1154.8" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Запустить рабочую версию и наблюдать первые кейсы</tspan>
</text>
<text data-owner="card-6" x="832" y="897.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="832" dy="0">5 Исправить и</tspan>
<tspan x="832" dy="33.599999999999994">записать</tspan>
</text>
<text data-owner="card-6" x="832" y="976.4000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="832" dy="0">Что изменили, какой</tspan>
<tspan x="832" dy="28">риск сняли, кто</tspan>
<tspan x="832" dy="28">владелец сценария</tspan>
</text>
<text data-owner="" x="762" y="691.2" font-size="18" font-weight="600" fill="#ac3549">
<tspan x="762" dy="0">Повторный тест</tspan>
</text>
<text data-owner="" x="746" y="823.2" font-size="18" font-weight="600" fill="#ac3549">
<tspan x="746" dy="0">Есть ошибки</tspan>
</text>
<text data-owner="" x="400" y="1029.2" font-size="18" font-weight="600" fill="#0b7285">
<tspan x="400" dy="0">Проверки пройдены</tspan>
</text>
<text data-owner="note-7" x="68" y="1281.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Красная стрелка показывает правило возврата</tspan>
</text>
<text data-owner="note-8" x="68" y="1365.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Если тест дал шум, дубли или неверных получателей, сценарий возвращается на доработку, а не идет</tspan>
<tspan x="68" dy="28">сразу в боевую базу</tspan>
</text>
</g>
</svg>
