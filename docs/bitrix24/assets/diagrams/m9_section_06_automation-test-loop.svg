<rect x="41" y="1081.2" width="4" height="108" rx="2" fill="#0b7285"/>
<rect id="card-6" data-card="true" x="808" y="849.2" width="272" height="238" rx="18" fill="#fff3f4" stroke="#ac3549" stroke-width="1.5"/>
<rect x="809" y="869.2" width="4" height="198" rx="2" fill="#ac3549"/>
