<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1454" viewBox="0 0 1120 1454" role="img" aria-labelledby="title desc" font-family="Segoe UI, sans-serif">
<title id="title">Цикл тестирования автоматизации</title>
<desc id="desc">Учебная схема для M9 с безопасным циклом тестирования робота, триггера или бизнес-процесса до запуска в боевом процессе.</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#0b7285" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-red" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#ac3549" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#946019" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1120" height="1454" rx="24" fill="#f5f8fb"/>
<path d="M40 16H1080" stroke="#b6d9df" stroke-width="3"/>
<g id="connections">
<path data-edge="true" data-relation="sequence" d="M380,364.2 L380,419.2" fill="none" stroke="#0b7285" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path data-edge="true" data-relation="sequence" d="M380,576.2 L380,631.2" fill="none" stroke="#0b7285" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path data-edge="true" data-relation="sequence" d="M380,788.2 L380,843.2" fill="none" stroke="#0b7285" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path data-edge="true" data-relation="sequence" d="M380,1000.2 L380,1055.2" fill="none" stroke="#0b7285" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path data-edge="true" data-relation="test-failed" d="M724,923.2 L802,923.2" fill="none" stroke="#ac3549" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<path data-edge="true" data-relation="retest-after-fix" d="M944,845.2 L944,711.2 L726,711.2" fill="none" stroke="#ac3549" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
</g>
<g id="blocks">
<rect id="card-1" data-card="true" x="40" y="213.2" width="680" height="148" rx="18" fill="#fff" stroke="#bfd0dc" stroke-width="1.5"/>
