<rect x="121" y="361.2" width="4" height="72" rx="2" fill="#0b7285"/>
<line x1="410" y1="365.2" x2="410" y2="429.2" stroke="#bfd0dc"/>
<rect id="card-3" data-card="true" x="120" y="497.2" width="880" height="112" rx="18" fill="#fff" stroke="#bfd0dc" stroke-width="1.5"/>
<rect x="121" y="517.2" width="4" height="72" rx="2" fill="#0b7285"/>
<line x1="410" y1="521.2" x2="410" y2="585.2" stroke="#bfd0dc"/>
