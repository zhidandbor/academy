<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M7 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Вопрос → отчет → метрика → вывод → действие</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Центральная учебная модель M7: отчетность нужна не для просмотра цифр, а для управленческого шага.</tspan>
</text>
<text data-owner="card-1" x="64" y="233.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">1. Вопрос</tspan>
</text>
<text data-owner="card-1" x="354" y="229.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Что нужно понять по объекту, сотруднику или подразделению?</tspan>
</text>
<text data-owner="card-2" x="64" y="361.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">2. Отчет</tspan>
</text>
<text data-owner="card-2" x="354" y="357.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Где это смотреть: базовый отчет, список задач, BI?</tspan>
</text>
<text data-owner="card-3" x="64" y="489.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">3. Метрика</tspan>
</text>
<text data-owner="card-3" x="354" y="485.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Какой сигнал важен: просрочки, без движения, загрузка?</tspan>
</text>
<text data-owner="card-4" x="64" y="617.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">4. Вывод</tspan>
</text>
<text data-owner="card-4" x="354" y="613.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Что означает сигнал: риск срока, блокер, неверная нагрузка?</tspan>
</text>
<text data-owner="card-5" x="64" y="745.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">5. Действие</tspan>
</text>
<text data-owner="card-5" x="354" y="741.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Что делаем дальше: уточняем, меняем срок, перераспределяем.</tspan>
</text>
<text data-owner="note-6" x="68" y="853.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Правило чтения M7: нельзя останавливать отчетность на цифре. Каждый показатель должен</tspan>
<tspan x="68" dy="28">заканчиваться проверкой причины и конкретным управленческим действием.</tspan>
</text>
</g>
</svg>
