<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M3 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Проект объединяет общение, задачи, встречи и файлы</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Пространство собирает людей, коммуникацию, задачи и материалы в одном месте, чтобы команда не</tspan>
<tspan x="40" dy="28">зависела от личной переписки.</tspan>
</text>
<text data-owner="card-1" x="244" y="261.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="244" dy="0">Проект</tspan>
</text>
<text data-owner="card-1" x="244" y="306.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="244" dy="0">Общая тема, участники, правила, история и точка входа</tspan>
</text>
<text data-owner="card-2" x="64" y="457.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Лента</tspan>
</text>
<text data-owner="card-2" x="64" y="502.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Новости, правила, общий контекст</tspan>
</text>
<text data-owner="card-3" x="640" y="457.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">Главный чат</tspan>
</text>
<text data-owner="card-3" x="640" y="502.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">Быстрые вопросы и координация</tspan>
</text>
<text data-owner="card-4" x="64" y="637.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Задачи</tspan>
</text>
<text data-owner="card-4" x="64" y="682.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Сроки, ответственные, результат</tspan>
</text>
<text data-owner="card-5" x="640" y="637.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">Диск</tspan>
</text>
<text data-owner="card-5" x="640" y="682.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">Файлы, шаблоны, рабочие папки</tspan>
</text>
<text data-owner="card-6" x="64" y="817.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Календарь</tspan>
</text>
<text data-owner="card-6" x="64" y="862.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Встречи и выезды</tspan>
</text>
<text data-owner="card-7" x="640" y="817.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">База знаний</tspan>
</text>
<text data-owner="card-7" x="640" y="862.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">Отдельно, по ссылке</tspan>
</text>
<text data-owner="note-8" x="68" y="989.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Если в теме есть только переписка, команда теряет память о решениях. Если есть пространство, каждый</tspan>
<tspan x="68" dy="28">участник быстрее находит контекст, файлы и текущие действия.</tspan>
</text>
