<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1418" viewBox="0 0 1120 1418" role="img" aria-labelledby="title desc" font-family="Segoe UI, sans-serif">
<title id="title">Схема жизненного цикла шаблона документа</title>
<desc id="desc">Схема показывает, как эталонный шаблон проходит путь от черновика до публикации, использования, обновления и архивирования старой версии.</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#0b7285" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-red" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#ac3549" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#946019" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1120" height="1418" rx="24" fill="#f5f8fb"/>
<path d="M40 16H1080" stroke="#b6d9df" stroke-width="3"/>
<g id="connections">
<path data-edge="true" data-relation="sequence" d="M380,409 L380,444" fill="none" stroke="#0b7285" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path data-edge="true" data-relation="sequence" d="M380,601 L380,636" fill="none" stroke="#0b7285" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path data-edge="true" data-relation="sequence" d="M380,793 L380,828" fill="none" stroke="#0b7285" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path data-edge="true" data-relation="sequence" d="M380,985 L380,1020" fill="none" stroke="#0b7285" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<path data-edge="true" data-relation="new-version" d="M724,908 L802,908" fill="none" stroke="#946019" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<path data-edge="true" data-relation="review-new-version" d="M944,831 L944,524 L726,524" fill="none" stroke="#946019" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/>
</g>
<g id="blocks">
<rect id="card-1" data-card="true" x="40" y="258" width="680" height="148" rx="18" fill="#fff" stroke="#bfd0dc" stroke-width="1.5"/>
<rect x="41" y="278" width="4" height="108" rx="2" fill="#0b7285"/>
<rect id="card-2" data-card="true" x="40" y="450" width="680" height="148" rx="18" fill="#fff" stroke="#bfd0dc" stroke-width="1.5"/>
<rect x="41" y="470" width="4" height="108" rx="2" fill="#0b7285"/>
<rect id="card-3" data-card="true" x="40" y="642" width="680" height="148" rx="18" fill="#fff" stroke="#bfd0dc" stroke-width="1.5"/>
<rect x="41" y="662" width="4" height="108" rx="2" fill="#0b7285"/>
<rect id="card-4" data-card="true" x="40" y="834" width="680" height="148" rx="18" fill="#fff" stroke="#bfd0dc" stroke-width="1.5"/>
<rect x="41" y="854" width="4" height="108" rx="2" fill="#0b7285"/>
<rect id="card-5" data-card="true" x="40" y="1026" width="680" height="148" rx="18" fill="#edf8f5" stroke="#bfd0dc" stroke-width="1.5"/>
<rect x="41" y="1046" width="4" height="108" rx="2" fill="#0b7285"/>
<rect id="card-6" data-card="true" x="808" y="834" width="272" height="204" rx="18" fill="#fff8eb" stroke="#946019" stroke-width="1.5"/>
<rect x="809" y="854" width="4" height="164" rx="2" fill="#946019"/>
<rect id="note-7" data-card="true" x="40" y="1206" width="1040" height="68" rx="14" fill="#edf8f5" stroke="#bfd0dc" stroke-width="1.5"/>
<rect id="note-8" data-card="true" x="40" y="1290" width="1040" height="96" rx="14" fill="#edf8f5" stroke="#bfd0dc" stroke-width="1.5"/>
</g>
<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M6 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Эталонный шаблон не заполняют напрямую: он проходит свой</tspan>
<tspan x="40" dy="44.8">жизненный цикл</tspan>
</text>
<text data-owner="" x="40" y="190" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Сотрудник должен брать копию в работу, а не превращать официальный шаблон в очередной испорченный</tspan>
<tspan x="40" dy="28">рабочий документ.</tspan>
</text>
<text data-owner="card-1" x="64" y="306" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">1. Черновик</tspan>
</text>
<text data-owner="card-1" x="64" y="351.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Новая форма создается и редактируется</tspan>
</text>
<text data-owner="card-2" x="64" y="498" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">2. Проверка</tspan>
</text>
<text data-owner="card-2" x="64" y="543.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Ответственные сверяют форму и реквизиты</tspan>
</text>
<text data-owner="card-3" x="64" y="690" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">3. Утвержден</tspan>
</text>
<text data-owner="card-3" x="64" y="735.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Шаблон признан официальным эталоном компании</tspan>
</text>
<text data-owner="card-4" x="64" y="882" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">4. Опубликован</tspan>
</text>
<text data-owner="card-4" x="64" y="927.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Лежит на общем Диске с правом чтения или копии</tspan>
</text>
<text data-owner="card-5" x="64" y="1074" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">5. Копия</tspan>
</text>
<text data-owner="card-5" x="64" y="1119.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Рабочий экземпляр попадает в контур объекта</tspan>
</text>
<text data-owner="card-6" x="832" y="882" font-size="24" font-weight="700" fill="#17324d">
<tspan x="832" dy="0">6. Обновление</tspan>
</text>
<text data-owner="card-6" x="832" y="927.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="832" dy="0">Новая версия заменяет</tspan>
<tspan x="832" dy="28">старую, архив уходит</tspan>
<tspan x="832" dy="28">ниже</tspan>
</text>
<text data-owner="" x="746" y="788" font-size="18" font-weight="600" fill="#946019">
<tspan x="746" dy="0">При изменении</tspan>
<tspan x="746" dy="25.2">формы</tspan>
</text>
<text data-owner="" x="746" y="478" font-size="18" font-weight="600" fill="#946019">
<tspan x="746" dy="0">Новая версия → проверка</tspan>
</text>
<text data-owner="note-7" x="68" y="1246" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Ключевой запрет: не открывать и не заполнять опубликованный эталонный шаблон поверх оригинала.</tspan>
</text>
<text data-owner="note-8" x="68" y="1330" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Правильный путь: взять копию, работать в ней, а старую официальную форму при изменениях</tspan>
<tspan x="68" dy="28">переводить в архив, сохраняя для команды только один актуальный эталон.</tspan>
</text>
</g>
</svg>
