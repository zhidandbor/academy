<rect id="note-9" data-card="true" x="40" y="914.8" width="1040" height="96" rx="14" fill="#edf8f5" stroke="#bfd0dc" stroke-width="1.5"/>
</g>
<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M10 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Webhook в M10: кто к кому обращается</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Входящий webhook дает внешней системе вход в Bitrix24. Исходящий webhook отправляет событие из Bitrix24</tspan>
<tspan x="40" dy="28">наружу.</tspan>
</text>
<text data-owner="" x="40" y="235.2" font-size="22" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Входящий webhook</tspan>
</text>
<text data-owner="card-1" x="64" y="312" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Сайт или форма</tspan>
</text>
<text data-owner="card-2" x="428" y="312" font-size="24" font-weight="700" fill="#17324d">
<tspan x="428" dy="0">Webhook</tspan>
</text>
<text data-owner="card-2" x="428" y="357.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="428" dy="0">URL + права</tspan>
</text>
<text data-owner="card-3" x="792" y="312" font-size="24" font-weight="700" fill="#17324d">
<tspan x="792" dy="0">B24</tspan>
</text>
<text data-owner="note-4" x="68" y="476" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Когда подходит: быстро создать лид, сделку, комментарий или задачу из внешнего источника. URL нельзя</tspan>
<tspan x="68" dy="28">хранить в открытых чатах, письмах и документах.</tspan>
</text>
<text data-owner="" x="40" y="586" font-size="22" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Исходящий webhook</tspan>
</text>
<text data-owner="card-5" x="64" y="662.8" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">B24</tspan>
</text>
<text data-owner="card-6" x="428" y="662.8" font-size="24" font-weight="700" fill="#17324d">
<tspan x="428" dy="0">Событие</tspan>
</text>
<text data-owner="card-6" x="428" y="708.4" font-size="20" font-weight="400" fill="#526579">
<tspan x="428" dy="0">стадия / создание</tspan>
</text>
<text data-owner="card-7" x="792" y="662.8" font-size="24" font-weight="700" fill="#17324d">
<tspan x="792" dy="0">Внешний обработчик</tspan>
</text>
<text data-owner="note-8" x="68" y="826.8" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Когда подходит: нужно сообщить наружу о событии внутри Bitrix24 и передать пакет полей. Нужен</tspan>
<tspan x="68" dy="28">защищенный внешний обработчик, лог и контроль повторов.</tspan>
</text>
<text data-owner="note-9" x="68" y="954.8" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Учебное правило M10 Не путайте направление: входящий webhook дает вход в Bitrix24, исходящий</tspan>
<tspan x="68" dy="28">webhook уведомляет внешнюю систему.</tspan>
</text>
</g>
</svg>
