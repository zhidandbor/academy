<rect x="405" y="634.8" width="4" height="108" rx="2" fill="#0b7285"/>
<rect id="card-7" data-card="true" x="768" y="614.8" width="312" height="148" rx="18" fill="#edf8f5" stroke="#bfd0dc" stroke-width="1.5"/>
<rect x="769" y="634.8" width="4" height="108" rx="2" fill="#0b7285"/>
