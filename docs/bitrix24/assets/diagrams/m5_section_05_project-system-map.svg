<tspan x="40" dy="0">M5 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Проект собирает все инструменты в один контур управления</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Пользователь видит не отдельные функции, а путь от общей рамки проекта к задачам, стадиям, срокам и</tspan>
<tspan x="40" dy="28">календарным событиям.</tspan>
</text>
<text data-owner="card-1" x="244" y="261.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="244" dy="0">Проект</tspan>
</text>
<text data-owner="card-1" x="244" y="306.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="244" dy="0">Цель, команда, правила, материалы и точка входа для работы по</tspan>
<tspan x="244" dy="28">объекту</tspan>
</text>
<text data-owner="card-2" x="64" y="485.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Задачи</tspan>
</text>
<text data-owner="card-2" x="64" y="530.8" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Что сделать, кто отвечает, какие сроки</tspan>
<tspan x="64" dy="28">нужны и какой результат</tspan>
</text>
<text data-owner="card-3" x="640" y="485.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">Канбан</tspan>
</text>
<text data-owner="card-3" x="640" y="530.8" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">На какой стадии находится каждая задача и</tspan>
<tspan x="640" dy="28">где узкое место</tspan>
</text>
<text data-owner="card-4" x="64" y="693.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Гант</tspan>
</text>
<text data-owner="card-4" x="64" y="738.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Как работа разложена по времени и</tspan>
<tspan x="64" dy="28">зависимостям</tspan>
</text>
<text data-owner="card-5" x="640" y="693.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">Календарь</tspan>
</text>
<text data-owner="card-5" x="640" y="738.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">Когда проходят встречи, выезды и окна</tspan>
<tspan x="640" dy="28">работ контрольные точки</tspan>
</text>
<text data-owner="note-6" x="68" y="893.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Проект связывает задачи, канбан, Гант и календарь в один рабочий контур.</tspan>
