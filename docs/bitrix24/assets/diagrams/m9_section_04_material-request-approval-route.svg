<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M9 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Учебный маршрут согласования заявки на материалы</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">M9: пример процесса, который уже нельзя сводить только к одному роботу или триггеру</tspan>
</text>
<text data-owner="card-1" x="144" y="233.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="144" dy="0">1. Автор: Мастер</tspan>
</text>
<text data-owner="card-1" x="144" y="278.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="144" dy="0">Создает заявку и прикладывает потребность</tspan>
</text>
<text data-owner="card-2" x="144" y="435.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="144" dy="0">2. Проверка: ПТО</tspan>
</text>
<text data-owner="card-2" x="144" y="480.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="144" dy="0">Проверяет состав, объем и корректность позиций</tspan>
</text>
<text data-owner="card-3" x="144" y="637.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="144" dy="0">3. Наличие: Снабжение</tspan>
</text>
<text data-owner="card-3" x="144" y="682.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="144" dy="0">Проверяет склад, резерв и потребность в закупке</tspan>
</text>
<text data-owner="card-4" x="144" y="839.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="144" dy="0">4. Порог: Руководитель</tspan>
</text>
<text data-owner="card-4" x="144" y="884.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="144" dy="0">Подключается, если сумма выше лимита</tspan>
</text>
<text data-owner="card-5" x="144" y="1041.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="144" dy="0">5. ОК: Согласовано</tspan>
</text>
<text data-owner="card-5" x="144" y="1086.8" font-size="20" font-weight="400" fill="#526579">
<tspan x="144" dy="0">Фиксируется решение и запускается действие</tspan>
</text>
<text data-owner="card-6" x="144" y="1243.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="144" dy="0">6. Действие: Задача закупщику</tspan>
</text>
<text data-owner="card-6" x="144" y="1288.8" font-size="20" font-weight="400" fill="#526579">
<tspan x="144" dy="0">Робот создает задачу и передает контекст</tspan>
</text>
<text data-owner="card-7" x="144" y="1445.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="144" dy="0">7. Уведомление: Автору заявки</tspan>
</text>
<text data-owner="card-7" x="144" y="1490.8" font-size="20" font-weight="400" fill="#526579">
<tspan x="144" dy="0">Сообщаем статус, срок и следующий шаг</tspan>
</text>
<text data-owner="" x="874" y="809.2" font-size="18" font-weight="600" fill="#946019">
<tspan x="874" dy="0">Сумма в</tspan>
<tspan x="874" dy="25.2">пределах лимита</tspan>
</text>
<text data-owner="" x="874" y="903.2" font-size="18" font-weight="400" fill="#946019">
<tspan x="874" dy="0">Сразу к</tspan>
<tspan x="874" dy="25.2">согласованию</tspan>
</text>
<text data-owner="note-8" x="68" y="1617.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Возврат На доработку. Если есть замечания, маршрут идет автору. Красная ветка: возврат. На доработке</tspan>
<tspan x="68" dy="28">важны комментарий, срок и новый вход в маршрут</tspan>
</text>
<text data-owner="note-9" x="68" y="1745.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Правило M9: согласование описываем как маршрут с ролями и возвратами, а создание задачи</tspan>
<tspan x="68" dy="28">закупщику оставляем роботу как отдельное действие</tspan>
</text>
</g>
</svg>
