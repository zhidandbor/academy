<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M2 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Как выбрать канал коммуникации в Bitrix24</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Сначала ответьте на вопрос: что вы хотите сделать прямо сейчас - сообщить, уточнить, обсудить или назначить</tspan>
<tspan x="40" dy="28">работу.</tspan>
</text>
<text data-owner="card-1" x="244" y="261.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="244" dy="0">Что требуется от коммуникации?</tspan>
</text>
<text data-owner="card-2" x="64" y="421.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Живая лента</tspan>
</text>
<text data-owner="card-2" x="64" y="466.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Когда нужно сообщить новость,</tspan>
<tspan x="64" dy="28">объявление, правило или общий старт.</tspan>
</text>
<text data-owner="card-3" x="640" y="421.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">Чат</tspan>
</text>
<text data-owner="card-3" x="640" y="466.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">Когда нужно быстро уточнить, спросить,</tspan>
<tspan x="640" dy="28">предупредить или собрать реакцию.</tspan>
</text>
<text data-owner="card-4" x="64" y="629.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Звонок</tspan>
</text>
<text data-owner="card-4" x="64" y="674.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Когда вопрос сложный, нужен голос, экран</tspan>
<tspan x="64" dy="28">или быстрое согласование.</tspan>
</text>
<text data-owner="card-5" x="640" y="629.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">Задача</tspan>
</text>
<text data-owner="card-5" x="640" y="674.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">Когда нужен ответственный, срок и</tspan>
<tspan x="640" dy="28">результат.</tspan>
</text>
<text data-owner="note-6" x="68" y="829.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Обсуждение существующей задачи ведите в ее чате: там сохраняются сообщения, файлы и история</tspan>
<tspan x="68" dy="28">работы.</tspan>
</text>
