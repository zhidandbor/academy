<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="918" viewBox="0 0 1120 918" role="img" aria-labelledby="title desc" font-family="Segoe UI, sans-serif">
<title id="title">Схема выбора канала коммуникации в Bitrix24</title>
<desc id="desc">Для информирования подходит лента, для уточнений чат, для сложного обсуждения звонок, для результата со сроком и ответственным задача. Вопросы по существующей задаче обсуждаются в ее собственном чате.</desc>
<defs>
