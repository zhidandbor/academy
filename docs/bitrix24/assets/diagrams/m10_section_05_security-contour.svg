<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M10 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Контур безопасности M10</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Интеграция считается безопасной, когда права, токены, журнал и ответственность описаны заранее.</tspan>
</text>
<text data-owner="card-1" x="244" y="233.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="244" dy="0">Интеграция</tspan>
</text>
<text data-owner="card-1" x="244" y="278.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="244" dy="0">цель + данные права + журнал</tspan>
</text>
<text data-owner="card-2" x="64" y="429.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Минимальные права</tspan>
</text>
<text data-owner="card-2" x="64" y="474.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Только те scope и доступы, без которых</tspan>
<tspan x="64" dy="28">сценарий не работает.</tspan>
</text>
<text data-owner="card-3" x="640" y="429.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">Токены и URL</tspan>
</text>
<text data-owner="card-3" x="640" y="474.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">Хранятся как чувствительные данные, не</tspan>
<tspan x="640" dy="28">публично.</tspan>
</text>
<text data-owner="card-4" x="64" y="637.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Журнал и тест</tspan>
</text>
<text data-owner="card-4" x="64" y="682.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Логи, тестовый сценарий, контроль ошибок</tspan>
<tspan x="64" dy="28">и повторов.</tspan>
</text>
<text data-owner="card-5" x="640" y="637.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">Владелец</tspan>
</text>
<text data-owner="card-5" x="640" y="682.8000000000001" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">Есть бизнес-владелец и технический</tspan>
<tspan x="640" dy="28">ответственный.</tspan>
</text>
<text data-owner="note-6" x="68" y="837.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Если хотя бы одного блока нет, растет риск хаоса.</tspan>
</text>
