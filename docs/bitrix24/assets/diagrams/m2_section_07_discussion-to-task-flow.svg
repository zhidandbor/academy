<rect id="card-5" data-card="true" x="40" y="725.2" width="1040" height="84" rx="18" fill="#edf8f5" stroke="#bfd0dc" stroke-width="1.5"/>
<rect x="41" y="745.2" width="4" height="44" rx="2" fill="#0b7285"/>
<line x1="330" y1="749.2" x2="330" y2="785.2" stroke="#bfd0dc"/>
