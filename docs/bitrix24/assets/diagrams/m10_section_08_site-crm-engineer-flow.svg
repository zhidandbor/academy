<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M10 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Сквозной маршрут M10</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Как один сценарий проходит путь от сайта до CRM, задачи инженеру и управляемого сопровождения.</tspan>
</text>
<text data-owner="card-1" x="64" y="233.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Сайт</tspan>
</text>
<text data-owner="card-1" x="354" y="229.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Форма заявки с обязательными полями</tspan>
</text>
<text data-owner="card-2" x="64" y="361.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">CRM</tspan>
</text>
<text data-owner="card-2" x="354" y="357.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Лид или сделка с источником заявки</tspan>
</text>
<text data-owner="card-3" x="64" y="489.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Задача</tspan>
</text>
<text data-owner="card-3" x="354" y="485.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Поручение инженеру с нужными полями</tspan>
</text>
<text data-owner="card-4" x="64" y="617.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Журнал</tspan>
</text>
<text data-owner="card-4" x="354" y="613.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Успех, ошибка, дубли и повторы</tspan>
</text>
<text data-owner="" x="40" y="707.2" font-size="22" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Проверки, права и реестр сопровождают весь маршрут</tspan>
</text>
<text data-owner="card-5" x="64" y="784" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Проверки</tspan>
</text>
<text data-owner="card-5" x="64" y="829.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Пустое поле Повторная</tspan>
<tspan x="64" dy="28">отправка Недоступность</tspan>
<tspan x="64" dy="28">сервиса</tspan>
</text>
<text data-owner="card-6" x="420" y="784" font-size="24" font-weight="700" fill="#17324d">
<tspan x="420" dy="0">Права</tspan>
</text>
<text data-owner="card-6" x="420" y="829.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="420" dy="0">Минимальные scope</tspan>
<tspan x="420" dy="28">Защищенный URL</tspan>
<tspan x="420" dy="28">Назначенный владелец</tspan>
</text>
<text data-owner="card-7" x="776" y="784" font-size="24" font-weight="700" fill="#17324d">
<tspan x="776" dy="0">Реестр</tspan>
</text>
<text data-owner="card-7" x="776" y="829.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="776" dy="0">Цель и тип интеграции</tspan>
<tspan x="776" dy="28">Ответственные и тест Дата</tspan>
<tspan x="776" dy="28">проверки и ссылка</tspan>
</text>
<text data-owner="note-8" x="68" y="1012" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">M10 учит не подключать API ради API, а строить управляемый маршрут с проверками, правами и</tspan>
<tspan x="68" dy="28">сопровождением.</tspan>
</text>
