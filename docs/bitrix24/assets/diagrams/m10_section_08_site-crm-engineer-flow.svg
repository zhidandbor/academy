<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc" font-family="Segoe UI, sans-serif">
<title id="title">Сайт → CRM → задача инженеру</title>
<desc id="desc">Учебная схема сквозного маршрута для M10: заявка с сайта, CRM, задача инженеру, журнал и реестр.</desc>
