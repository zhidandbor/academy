<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M4 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Поручение должно пройти путь до принятого результата</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Задача нужна не ради формы, а ради фиксации результата, срока, ответственного и места, где сохраняется</tspan>
<tspan x="40" dy="28">рабочий контекст.</tspan>
</text>
<text data-owner="card-1" x="64" y="261.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">1. Поручение</tspan>
</text>
<text data-owner="card-1" x="354" y="257.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Фраза в чате, письме или разговоре сама по себе еще не управляет</tspan>
<tspan x="354" dy="28">работой.</tspan>
</text>
<text data-owner="card-2" x="64" y="417.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">2. Фиксация</tspan>
</text>
<text data-owner="card-2" x="354" y="413.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Уточняем результат, срок, материалы и одного ответственного.</tspan>
</text>
<text data-owner="card-3" x="64" y="545.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">3. Карточка</tspan>
</text>
<text data-owner="card-3" x="354" y="541.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Создаем задачу с описанием, файлами, ролями и критериями.</tspan>
</text>
<text data-owner="card-4" x="64" y="673.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">4. Исполнение</tspan>
</text>
<text data-owner="card-4" x="354" y="669.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Комментарии, файлы и статусы живут внутри самой задачи.</tspan>
</text>
<text data-owner="card-5" x="64" y="801.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">5. Приемка</tspan>
</text>
<text data-owner="card-5" x="354" y="797.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Постановщик принимает результат или возвращает на доработку.</tspan>
</text>
<text data-owner="note-6" x="68" y="909.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Короткая формула M4: распознали работу, оформили задачу, вели ее внутри карточки, приняли</tspan>
<tspan x="68" dy="28">проверяемый результат.</tspan>
</text>
</g>
</svg>
