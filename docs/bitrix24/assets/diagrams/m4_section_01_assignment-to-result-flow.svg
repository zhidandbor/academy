<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="998" viewBox="0 0 1120 998" role="img" aria-labelledby="title desc" font-family="Segoe UI, sans-serif">
<title id="title">Схема поручение - задача - результат</title>
<desc id="desc">Схема показывает путь от поручения через фиксацию результата и создание карточки задачи к исполнению и принятому результату.</desc>
<defs>
