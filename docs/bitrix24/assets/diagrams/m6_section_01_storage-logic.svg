<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="998" viewBox="0 0 1120 998" role="img" aria-labelledby="title desc" font-family="Segoe UI, sans-serif">
<title id="title">Схема логики хранения документов и знаний в Bitrix24</title>
<desc id="desc">Схема показывает, как различаются Диск, База знаний, задача и проектный контур при работе с файлами, инструкциями и комплектами по объекту.</desc>
