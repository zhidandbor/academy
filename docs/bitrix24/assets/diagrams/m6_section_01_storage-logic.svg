<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M6 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">В M6 важно различать файл, инструкцию, задачу и комплект по</tspan>
<tspan x="40" dy="44.8">объекту</tspan>
</text>
<text data-owner="" x="40" y="190" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Когда команда понимает роль каждого контура, документы перестают расползаться по чатам, личным папкам</tspan>
<tspan x="40" dy="28">и случайным копиям.</tspan>
</text>
<text data-owner="card-1" x="244" y="306" font-size="24" font-weight="700" fill="#17324d">
<tspan x="244" dy="0">Что у вас в руках?</tspan>
</text>
<text data-owner="card-1" x="244" y="351.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="244" dy="0">Файл, правило работы, поручение или комплект по объекту</tspan>
</text>
<text data-owner="card-2" x="64" y="502" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Диск</tspan>
</text>
<text data-owner="card-2" x="64" y="547.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Здесь живет сам файл: шаблон, акт, фото,</tspan>
<tspan x="64" dy="28">таблица, схема</tspan>
</text>
<text data-owner="card-3" x="640" y="502" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">База знаний</tspan>
</text>
<text data-owner="card-3" x="640" y="547.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">Здесь живет порядок действий: кто, когда и</tspan>
<tspan x="640" dy="28">как работает</tspan>
</text>
<text data-owner="card-4" x="64" y="710" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Задача</tspan>
</text>
<text data-owner="card-4" x="64" y="755.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Здесь живет работа по файлу: срок,</tspan>
<tspan x="64" dy="28">ответственный, результат</tspan>
</text>
<text data-owner="card-5" x="640" y="710" font-size="24" font-weight="700" fill="#17324d">
<tspan x="640" dy="0">Проект</tspan>
</text>
<text data-owner="card-5" x="640" y="755.6" font-size="20" font-weight="400" fill="#526579">
<tspan x="640" dy="0">Здесь живет комплект по объекту: файлы,</tspan>
<tspan x="640" dy="28">задачи, участники, события</tspan>
</text>
<text data-owner="note-6" x="68" y="910" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Простое правило M6: файл кладем на Диск, правило описываем в Базе знаний, работу по документу</tspan>
<tspan x="68" dy="28">ведем в задаче, а комплект по объекту собираем в проектном контуре.</tspan>
</text>
