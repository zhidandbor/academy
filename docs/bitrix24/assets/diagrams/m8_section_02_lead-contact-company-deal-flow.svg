<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M8 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">От входящего интереса к управляемой CRM-связке</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">Учебная логика M8: сначала ищем существующую историю, затем создаем только нужные сущности и</tspan>
<tspan x="40" dy="28">связываем их между собой.</tspan>
</text>
<text data-owner="card-1" x="64" y="261.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">1. Запрос</tspan>
</text>
<text data-owner="card-1" x="354" y="257.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Письмо, звонок, форма, рекомендация или повторный</tspan>
<tspan x="354" dy="28">интерес.</tspan>
</text>
<text data-owner="card-2" x="64" y="417.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">2. Поиск</tspan>
</text>
<text data-owner="card-2" x="354" y="413.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Ищем компанию, контакт и старые сделки в CRM.</tspan>
</text>
<text data-owner="card-3" x="64" y="545.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">3. Лид</tspan>
</text>
<text data-owner="card-3" x="354" y="541.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Используем в classic CRM, если входящий интерес еще</tspan>
<tspan x="354" dy="28">не разобран.</tspan>
</text>
<text data-owner="card-4" x="64" y="701.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">4. Клиент</tspan>
</text>
<text data-owner="card-4" x="354" y="697.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Компания хранит организацию, контакт хранит</tspan>
<tspan x="354" dy="28">человека.</tspan>
</text>
<text data-owner="card-5" x="64" y="857.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">5. Сделка</tspan>
</text>
<text data-owner="card-5" x="354" y="853.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Конкретная возможность, предмет работы, стадия и</tspan>
<tspan x="354" dy="28">ответственный.</tspan>
</text>
<text data-owner="card-6" x="64" y="1013.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">6. Активность</tspan>
</text>
<text data-owner="card-6" x="354" y="1009.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Следующий звонок, письмо, встреча или задача по</tspan>
<tspan x="354" dy="28">дате.</tspan>
</text>
<text data-owner="" x="918" y="515.2" font-size="18" font-weight="600" fill="#946019">
<tspan x="918" dy="0">simple CRM</tspan>
</text>
<text data-owner="" x="918" y="545.2" font-size="18" font-weight="400" fill="#946019">
<tspan x="918" dy="0">без лида</tspan>
</text>
<text data-owner="note-7" x="68" y="1149.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Правило M8: не создавайте новую сущность, пока не проверили CRM на существующую историю. Новая</tspan>
<tspan x="68" dy="28">сделка по существующему клиенту допустима, новый дубль контакта или компании — нет.</tspan>
</text>
<text data-owner="note-8" x="68" y="1261.2" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Если портал работает в classic CRM, лид квалифицируется и затем превращается в связку клиента и</tspan>
<tspan x="68" dy="28">сделки; в simple CRM часть этого шага может происходить сразу через сделку с контактами.</tspan>
</text>
</g>
</svg>
