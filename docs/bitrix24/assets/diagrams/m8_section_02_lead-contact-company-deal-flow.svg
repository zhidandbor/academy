<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1350" viewBox="0 0 1120 1350" role="img" aria-labelledby="title desc" font-family="Segoe UI, sans-serif">
<title id="title">Схема CRM сущностей M8</title>
<desc id="desc">Учебная схема для модуля M8, показывающая путь от входящего интереса к лиду, контакту, компании, сделке и следующей активности.</desc>
