<g id="labels">
<text data-owner="" x="40" y="48" font-size="16" font-weight="700" fill="#0b7285">
<tspan x="40" dy="0">M9 / СХЕМА РАБОТЫ</tspan>
</text>
<text data-owner="" x="40" y="100.4" font-size="32" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Робот, триггер и бизнес-процесс: что за что отвечает</tspan>
</text>
<text data-owner="" x="40" y="145.2" font-size="20" font-weight="400" fill="#526579">
<tspan x="40" dy="0">M9: сначала описываем процесс, потом выбираем минимально достаточный инструмент</tspan>
</text>
<text data-owner="card-1" x="64" y="233.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Робот</tspan>
</text>
<text data-owner="card-1" x="64" y="278.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Выполняет действие</tspan>
</text>
<text data-owner="card-1" x="64" y="314.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Создать задачу</tspan>
</text>
<text data-owner="card-1" x="64" y="350.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Отправить уведомление</tspan>
</text>
<text data-owner="card-1" x="64" y="386.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Сменить ответственного</tspan>
</text>
<text data-owner="card-1" x="64" y="422.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Поставить задержку или</tspan>
<tspan x="64" dy="28">контроль</tspan>
</text>
<text data-owner="card-1" x="64" y="486.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="64" dy="0">Когда использовать: На</tspan>
<tspan x="64" dy="28">известной стадии, когда</tspan>
<tspan x="64" dy="28">действие повторяется</tspan>
</text>
<text data-owner="card-2" x="420" y="233.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="420" dy="0">Триггер</tspan>
</text>
<text data-owner="card-2" x="420" y="278.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="420" dy="0">Реагирует на событие</tspan>
</text>
<text data-owner="card-2" x="420" y="314.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="420" dy="0">Ответ клиента</tspan>
</text>
<text data-owner="card-2" x="420" y="350.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="420" dy="0">Загрузка файла</tspan>
</text>
<text data-owner="card-2" x="420" y="386.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="420" dy="0">Закрытие связанной задачи</tspan>
</text>
<text data-owner="card-2" x="420" y="422.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="420" dy="0">Переход на следующую</tspan>
<tspan x="420" dy="28">стадию</tspan>
</text>
<text data-owner="card-2" x="420" y="486.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="420" dy="0">Когда использовать: Когда</tspan>
<tspan x="420" dy="28">нужно поймать событие и</tspan>
<tspan x="420" dy="28">сдвинуть объект по процессу</tspan>
</text>
<text data-owner="card-3" x="776" y="233.2" font-size="24" font-weight="700" fill="#17324d">
<tspan x="776" dy="0">Бизнес-процесс</tspan>
</text>
<text data-owner="card-3" x="776" y="278.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="776" dy="0">Управляет маршрутом</tspan>
</text>
<text data-owner="card-3" x="776" y="314.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="776" dy="0">Несколько ролей</tspan>
</text>
<text data-owner="card-3" x="776" y="350.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="776" dy="0">Возврат на доработку</tspan>
</text>
<text data-owner="card-3" x="776" y="386.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="776" dy="0">Ветки решения и</tspan>
<tspan x="776" dy="28">согласования</tspan>
</text>
<text data-owner="card-3" x="776" y="450.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="776" dy="0">Протокол прохождения</tspan>
</text>
<text data-owner="card-3" x="776" y="486.79999999999995" font-size="20" font-weight="400" fill="#526579">
<tspan x="776" dy="0">Когда использовать: Когда</tspan>
<tspan x="776" dy="28">одного шага мало и нужен</tspan>
<tspan x="776" dy="28">управляемый маршрут</tspan>
</text>
<text data-owner="" x="40" y="651.2" font-size="22" font-weight="700" fill="#17324d">
<tspan x="40" dy="0">Как они работают вместе</tspan>
</text>
<text data-owner="card-4" x="64" y="728" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Событие в процессе</tspan>
</text>
<text data-owner="card-4" x="354" y="724" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Ответ клиента, файл, срок</tspan>
</text>
<text data-owner="card-5" x="64" y="856" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Триггер</tspan>
</text>
<text data-owner="card-5" x="354" y="852" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Распознает событие</tspan>
</text>
<text data-owner="card-6" x="64" y="984" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Стадия или</tspan>
<tspan x="64" dy="33.599999999999994">маршрут</tspan>
</text>
<text data-owner="card-6" x="354" y="980" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Сдвиг объекта по логике</tspan>
</text>
<text data-owner="card-7" x="64" y="1144" font-size="24" font-weight="700" fill="#17324d">
<tspan x="64" dy="0">Робот или БП</tspan>
</text>
<text data-owner="card-7" x="354" y="1140" font-size="20" font-weight="400" fill="#526579">
<tspan x="354" dy="0">Действие или согласование</tspan>
</text>
<text data-owner="note-8" x="68" y="1252" font-size="20" font-weight="400" fill="#17324d">
<tspan x="68" dy="0">Правило M9 Не автоматизировать хаос без схемы</tspan>
</text>
</g>
</svg>
