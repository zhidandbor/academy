<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1312" viewBox="0 0 1120 1312" role="img" aria-labelledby="title desc" font-family="Segoe UI, sans-serif">
<title id="title">Сравнение робота, триггера и бизнес-процесса</title>
<desc id="desc">Учебная схема для M9, показывающая различия между роботом, триггером и бизнес-процессом, а также их совместную работу в одном сценарии.</desc>
